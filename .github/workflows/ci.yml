name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: rspec (ruby ${{ matrix.ruby }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Floor is the gemspec's required_ruby_version.
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v5

      # The committed lockfile pins the maintainer's platform and one Ruby. A
      # gem has to work against whatever each Ruby in the matrix resolves, so
      # resolve fresh rather than replay someone else's resolution.
      - name: Drop the lockfile so each Ruby resolves its own dependencies
        run: rm -f Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rspec

  lint:
    name: rubocop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Drop the lockfile so the runner resolves its own dependencies
        run: rm -f Gemfile.lock

      - uses: ruby/setup-ruby@v1
        with:
          # Matches TargetRubyVersion in .rubocop.yml.
          ruby-version: "2.7"
          bundler-cache: true

      - run: bundle exec rubocop

  package:
    name: gem build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Catches a broken gemspec or a file list that no longer matches the tree
      # at push time instead of at release time.
      - run: gem build jekyll-secret-posts.gemspec
